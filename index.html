<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus - Autonomous Sensory Robotical Vehicle</title>
  <link rel="stylesheet" href="style.css" />
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
</head>
<body>
  <!-- Landing Section -->
  <section id="landing">
    <canvas id="stars-canvas"></canvas>
    <div class="landing-text">
      <h1>Nexus</h1>
      <p>Autonomous Sensory Robotical Vehicle</p>
      <div class="button-group">
        <button class="btn explore-btn">Explore</button>
        <button class="btn github-btn"><i class="fab fa-github"></i> GitHub</button>
      </div>
    </div>
  </section>

  <!-- Robots Section -->
  <section id="robots" class="container">
    <h2>Our Robots</h2>
    <div class="robot-video">
      <video controls>
        <source src="assets/video1.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
    <div class="robot-grid">
      <div class="robot-tile">
        <img src="assets/image1.png" alt="Robot 1">
      </div>
      <div class="robot-tile">
        <img src="assets/image2.png" alt="Robot 2">
      </div>
      <div class="robot-tile">
        <img src="assets/image3.png" alt="Robot 3">
      </div>
      <div class="robot-tile">
        <img src="assets/image4.png" alt="Robot 4">
      </div>
      <div class="robot-tile">
        <img src="assets/image5.png" alt="Robot 5">
      </div>
      <div class="robot-tile">
        <img src="assets/image6.png" alt="Robot 6">
      </div>
    </div>
  </section>

  <!-- Sandbox Section -->
  <section id="sandbox" class="container">
    <h2>Interactive Sandbox</h2>
    <div id="controls">
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button id="restart"></button>
    </div>
    <canvas id="sandbox-canvas" width="1100" height="400"></canvas>
    <div id="speedControl">
      <label for="speed-slider">Robot Speed (1x - 10x): </label>
      <input type="range" id="speed-slider" min="1" max="10" step="1" value="1">
    </div>
    <div class="charts">
      <div class="chart-container">
        <canvas id="chart1"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="chart2"></canvas>
      </div>
      <div class="chart-container">
        <canvas id="chart3"></canvas>
      </div>
    </div>
  </section>

  <!-- Team Section -->
  <section id="team" class="container">
    <h2>Our Project Leaders</h2>
    <div class="team-grid">
      <div class="team-member">
        <img src="https://via.placeholder.com/100" alt="Zakaria Kortam">
        <h3>Zakaria Kortam</h3>
        <div class="social-icons">
          <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/100" alt="Nicholas Normart">
        <h3>Nicholas Normart</h3>
        <div class="social-icons">
          <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/100" alt="Abdulrahman Alghamdi">
        <h3>Abdulrahman Alghamdi</h3>
        <div class="social-icons">
          <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </div>
      <div class="team-member">
        <img src="https://via.placeholder.com/100" alt="Osezele Omoko">
        <h3>Osezele Omoko</h3>
        <div class="social-icons">
          <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
          <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer with Three.js Scene -->
  <footer>
    <div id="earth-container">
      <div id="earth">
        <!-- Three.js canvas will be appended here via script.js -->
        <div class="footer-text">
          <p>© 2025 Nexus. All Rights Reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
